name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # npm 11.5+ (trusted publishing) needs Node 22.
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Trusted publishing: npm mints a short-lived token from the GitHub OIDC
      # identity of this workflow (id-token: write above). No NPM_TOKEN secret.
      - run: npm install -g npm@latest
      - run: npm publish --access public --provenance
